<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакти | Русанівський ліцей</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <h2>Київська Венеція & РЛ</h2>
      <nav>
        <a href="index.html">Головна</a>
        <a href="places.html">Локації</a>
        <a href="contacts.html" class="active">Контакти</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Зв'язатися з нами</h1>
    <p>Русанівський ліцей м. Києва, бульвар Ігоря Шамо, 17-А.</p>

    <form action="#" method="get">
      <div class="form-group">
        <label for="name">Ваше ім'я:</label>
        <input type="text" id="name" name="name" required placeholder="Олександр">
      </div>

      <div class="form-group">
        <label for="email">Електронна пошта:</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="message">Повідомлення:</label>
        <textarea id="message" name="message" rows="4" placeholder="Ваше запитання або відгук..."></textarea>
      </div>

      <button type="submit">Надіслати</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Проект з інформатики. Русанівський ліцей.</p>
  </footer>

</body>
</html>
